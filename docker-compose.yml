# Local services for the labs. Start with `make up`, stop with `make down`.
# Every port binds to 127.0.0.1 only, so nothing is reachable from your network.
name: iam-architect-labs

services:
  keycloak:
    # Pinned. Verified 2026-11-21: 26.8.2 is the latest release (standard token exchange V2
    # on by default; DPoP fully supported since 26.4).
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env (copy .env.example)}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080" # OIDC endpoints + admin console
      - "127.0.0.1:9000:9000" # management: /health/ready
    volumes:
      - ./labs/01-oauth-oidc-flows/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The Keycloak image has no curl, so use bash's /dev/tcp to hit the readiness probe.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
