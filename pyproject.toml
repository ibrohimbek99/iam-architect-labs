[project]
name = "iam-architect-labs"
version = "0.1.0"
description = "Runnable labs for modern identity architecture: OAuth/OIDC, agent identity, NHI, PBAC, secure RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["iam-shared"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
]

[tool.uv]
package = false  # the root is a workspace, not an installable package

[tool.uv.workspace]
members = ["shared"]  # labs join the workspace as they get Python code

[tool.uv.sources]
iam-shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit security checks; kept on everywhere because this is security code.
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "labs"]
addopts = "--import-mode=importlib -q"
