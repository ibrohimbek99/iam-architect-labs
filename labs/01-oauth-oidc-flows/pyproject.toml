[project]
name = "lab01-oauth-oidc"
version = "0.1.0"
description = "Lab 01: a correctly-validating resource server plus OAuth 2.x / OIDC flows against Keycloak."
requires-python = ">=3.12"
dependencies = [
    "iam-shared",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[tool.uv.sources]
iam-shared = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab01"]
