[project]
name = "iam-shared"
version = "0.2.0"
description = "Shared helpers for the labs: access-token validation, redacted audit events, test-only token minting."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_shared"]
